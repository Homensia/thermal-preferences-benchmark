# ============================================================
#  GLOBAL CONFIGURATION
# ============================================================
seed: 42


# ============================================================
#  DATA CONFIGURATION
# ============================================================
data:
  raw:
    ashrae_csv: "Data/ASHRAE_09_06_2022.csv"
    ashrae_meta: "Data/ASHRAE_09_06_2022_metadata.xlsx"
    moujalled: "Data/Moujalled.csv"
    hostein: "Data/Hostein.csv"

  clean:
    ashrae: "Data/ASHRAE_2022_Clean.csv"
    ashrae_api: "Data/ASHRAE_2022_Clean_api.csv"
    ashrae_2018_v2: "Data/ASHRAE_2018_v2.csv"
    moujalled_api: "Data/Moujalled_api.csv"
    hostein_api: "Data/Hostein_api.csv"

  # Phase 2 / Phase 3 feature space (17 features: 12 core + 5 EMA weather descriptors)
  features:
    - Tair
    - RH
    - clo
    - vel
    - Âge
    - Tout
    - Met
    - Trm_ema_28
    - RHout_ema_28
    - precip_ema_28
    - sunshine_ema_h_28
    - wind_ema_28

    - Sexe
    - Season
    - Climate
    - Building_type
    - cooling type

  # Phase 1 feature space (12 core features, Haghirad-compatible)
  features_12:
    - Tair
    - RH
    - clo
    - vel
    - Âge
    - Tout
    - Met

    - Sexe
    - Season
    - Climate
    - Building_type
    - cooling type

  # The 17 Phase 2 features + mean radiant temperature `tr`. Not used by the
  # experiments of the paper (kept unchanged; see docs/ENVIRONMENT_revision_2026-10.md).
  features_18:
    - Tair
    - RH
    - clo
    - vel
    - Âge
    - Tout
    - Met
    - Trm_ema_28
    - RHout_ema_28
    - precip_ema_28
    - sunshine_ema_h_28
    - wind_ema_28
    - tr

    - Sexe
    - Season
    - Climate
    - Building_type
    - cooling type

  # Dataset registry: maps --dataset CLI tag to (csv_path, feature_set)
  datasets:
    ASHRAE_2022:
      csv: "Data/ASHRAE_2022_Clean_api.csv"
      features: features       # 17 variables (Phase 2 default)
      category_normalisation: true   # frozen vocabulary (category_normalisation.py)
      split_dir: "splits/ASHRAE_2022"  # archived 80/20 split, loaded and checked
      folds_dir: "splits"              # {target}_folds.json, materialised once
    ASHRAE_2018_v2:
      csv: "Data/ASHRAE_2018_v2.csv"
      features: features_12    # 12 variables (Phase 1, Haghirad)
      category_normalisation: false  # Phase 1 not rerun; own vocabulary, original encoding
      split_dir: "splits/ASHRAE_2018"
      folds_dir: "splits/ASHRAE_2018"

  targets:
    - thermal_sensation
    - TSV_3p
    - thermal_preference

# ============================================================
#  WEATHER & API CONFIG
# ============================================================
weather:
  ema_windows: [28]
  days_fetch: 30
  cache_dir: ".cache"

# ============================================================
#  MODEL SELECTION
# ============================================================
models:
  classical:
    enabled: true
    selected: ["RandomForest", "XGBoost", "SVM"]

  deep:
    enabled: true
    selected: ["ANN", "FTTransformer"]

  # The FTT+RF / FTT+XGB hybrids are run by experiment E10 (hybrid.py) with the
  # head hyperparameters of revision_runners.PAPER_HYBRID_HEADS.

# ============================================================
#  CLASSICAL MODELS HYPERPARAMETERS
# ============================================================
classical_hparams:

  RandomForest:
    n_estimators: 225
    max_depth: 25
    min_samples_split: 10
    min_samples_leaf: 2
    class_weight: null

  XGBoost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.7
    colsample_bytree: 0.7

  SVM:
    kernel: ["rbf", "linear"]
    C: [0.5, 1, 5]
    gamma: ["scale", "auto"]

# ============================================================
#  DEEP MODELS HYPERPARAMETERS
# ============================================================
deep_hparams:

  ANN:
    hidden_layers: [256]
    dropout: 0.1
    epochs: 250
    lr: 0.0003
    batch_size: 1024
    patience: 10
    focal_gamma: null
    class_weights: null

  FTTransformer:
    dim: 256
    depth: 4
    heads: 8
    dim_head: 32
    attn_dropout: 0.1
    ff_dropout: 0.1
    epochs: 250
    lr: 0.0003
    batch_size: 1024
    patience: 10
    focal_gamma: null
    class_weights: null

# ============================================================
#  TRANSFER LEARNING CONFIG
# ============================================================
transfer:
  # The E6 strategies and regimes are fixed in phase3_runner.

  # Phase 3 FTT adaptation: one fixed, pre-declared budget for FT-head and
  # FT-full; no early stopping, no validation subset, last-epoch model. The
  # lr.ftt_local entry is not used by the paper (kept for the budget assertion).
  # Read and asserted by ftt_adaptation.load_budget; any other value raises.
  # (Numbers are written as 1.0e-4: YAML 1.1 parses `1e-4` as a string.)
  ftt_adaptation:
    epochs: 40
    batch_size: 1024
    weight_decay: 1.0e-5
    grad_clip: 1.0
    seed: 42
    lr:
      ftt_head: 1.0e-4
      ftt_full: 5.0e-5
      ftt_local: 3.0e-4

# ============================================================
#  COMPUTE: devices and parallelism of the fits. Read by compute.py and
#  compute_scheduler.py; no model hyperparameter is set here.
#  XGBoost runs on the CPU; 'cuda' is an optional path.
# ============================================================
compute:
  xgb_device: cpu        # every XGB fit (E1-E6); 'cuda' optional (raises if CUDA is unavailable, no silent fallback)
  torch_device: cuda     # ANN / FTT estimators of the runners; same no-fallback rule
  cpu_jobs: 20           # RF trees / SVM grid workers / XGB host threads
  gpu_concurrency: 1     # GPU jobs at once (separate processes); a real run refuses a higher override

# ============================================================
#  CROSS VALIDATION
# ============================================================
# Folds materialised once per target on the archived train split and shared by
# every family: StratifiedKFold(10, shuffle=True, random_state=42).
cross_validation:
  folds: 10
  shuffle: true

# ============================================================
#  FEATURE IMPORTANCE & VISUALIZATION
# ============================================================
visualization:
  feature_importance: true
  embeddings: true
  umap:
    n_components: 2
    max_points: 8000
